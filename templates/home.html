<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DataCrafter - Predict Marks</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f0f9ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .form-container {
      background-color: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 400px;
    }

    h1, h2 {
      text-align: center;
      color: #00796b;
    }

    label {
      display: block;
      margin: 15px 0 5px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .submit-btn {
      margin-top: 20px;
      background-color: #00796b;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      border-radius: 8px;
      transition: background 0.3s;
    }

    .submit-btn:hover {
      background-color: #004d40;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h1>Student Exam Performance Indicator</h1>
    <h2>Enter Student Details</h2>
    
    <form action="{{ url_for('predict_datapoint') }}" method="POST">

      <label for="gender">Gender:</label>
      <select name="gender" required>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>

      <label for="race_ethinicity">Race/Ethnicity:</label>
      <select name="race_ethinicity" required>
        <option value="group A">Group A</option>
        <option value="group B">Group B</option>
        <option value="group C">Group C</option>
        <option value="group D">Group D</option>
        <option value="group E">Group E</option>
      </select>

      <label for="parental_level_of_education">Parental Level of Education:</label>
      <select name="parental_level_of_education" required>
        <option value="some high school">Some High School</option>
        <option value="high school">High School</option>
        <option value="some college">Some College</option>
        <option value="associate's degree">Associate's Degree</option>
        <option value="bachelor's degree">Bachelor's Degree</option>
        <option value="master's degree">Master's Degree</option>
      </select>

      <label for="lunch">Lunch:</label>
      <select name="lunch" required>
        <option value="standard">Standard</option>
        <option value="free/reduced">Free/Reduced</option>
      </select>

      <label for="test_preparation_course">Test Preparation Course:</label>
      <select name="test_preparation_course" required>
        <option value="none">None</option>
        <option value="completed">Completed</option>
      </select>

      <label for="reading_score">Reading Score:</label>
      <input type="number" name="reading_score" min="0" max="100" required>

      <label for="writing_score">Writing Score:</label>
      <input type="number" name="writing_score" min="0" max="100" required>

      <button type="submit" class="submit-btn">Predict</button>
    </form>

    {% if results is defined %}
      <h2>Prediction: {{ results }}</h2>
    {% endif %}
  </div>

</body>
</html>
